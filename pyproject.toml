[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rivf2026-llm-url-routing"
version = "2.0.0"
description = "Selective Uncertainty-Aware LLM Routing for Phishing URL Triage (IEEE RIVF 2026)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy==2.2.6",
    "scikit-learn==1.7.2",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "httpx>=0.27,<1",
    "certifi>=2024.8",
    "pyyaml>=6.0",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
